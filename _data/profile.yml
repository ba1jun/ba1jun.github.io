short_bio: >-
  <p>
    I received my Ph.D. degree from the School of Computer Science and Engineering at Beihang University, China. I completed my doctoral studies under the supervision of <a href="https://wgrong.github.io/" target=\"_blank\">Prof. Wenge Rong</a> and <a href="https://scholar.google.com/citations?user=_6JexHoAAAAJ" target=\"_blank\">Prof. Chuantao Yin</a>.
  </p>

  <p>
      My research primarily focuses on building Trustworthy AI systems. My current research themes include: 
  </p>

  <ul>
      <li>Belief memory in agents: learning, retrieving, and revising beliefs over time.</li>
      <li>Improving LLMs’ faithful use of context for evidence-grounded generation and reasoning.</li>
      <li>Interpretability of LLMs and agents: explaining internal reasoning, memory use, and decision-making.</li>
  </ul>

  <p>
    <i class="fas fa-user-graduate"></i> I am always looking for <strong>self-motivated interns</strong>. Please feel free to drop me an email if interested.
  </p>

